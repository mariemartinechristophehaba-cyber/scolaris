<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block titre %}Scolaris{% endblock %}</title>
<meta name="theme-color" content="#F0F4FE">
<link rel="icon" href="{{ url_for('static', filename='img/icone.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icone-180.png') }}">
<link rel="preload" as="font" type="font/woff2" crossorigin href="{{ url_for('static', filename='fonts/poppins-500.woff2') }}">
<style>
/* Ecrans Connexion / Inscription = maquette (ecran de 550 x 1146) reproduite a l'echelle.
   Chaque element porte ses cotes de maquette : --x, --y (coin haut-gauche), --w, --h.
   Ecran plus court que la maquette : on rogne le haut (--s, 40 max) puis on resserre
   les espaces sous l'en-tete (--k). Ecran plus haut : les espaces s'agrandissent. */
@font-face{font-family:Poppins;font-weight:500;font-display:swap;src:url("{{ url_for('static', filename='fonts/poppins-500.woff2') }}") format("woff2")}
@font-face{font-family:Poppins;font-weight:600;font-display:swap;src:url("{{ url_for('static', filename='fonts/poppins-600.woff2') }}") format("woff2")}
@font-face{font-family:Poppins;font-weight:700;font-display:swap;src:url("{{ url_for('static', filename='fonts/poppins-700.woff2') }}") format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#F0F4FE}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;color:#010C61}
.ecran{--H:100vh;--p:min(calc(100vw / 550), calc(100vh / 1026));
  position:relative;height:100vh;overflow:hidden;background:#F0F4FE}
@supports (height:100dvh){.ecran{--H:100dvh;--p:min(calc(100vw / 550), calc(100dvh / 1026));height:100dvh}}
.ecran{--D:calc(1146 * var(--p) - var(--H));
  --s:clamp(0px, var(--D), calc(40 * var(--p)));
  --k:calc((var(--D) - var(--s)) / 666)}
.t{position:absolute;left:calc(50% + (var(--x, 0) - 275) * var(--p));width:calc(var(--w, 550) * var(--p));
  top:calc(var(--y) * var(--p) - var(--s) - max(0, calc(var(--y) - 480)) * var(--k));font-size:calc(var(--f, 20) * var(--p))}
.tete{position:absolute;left:0;width:100%;top:calc(-1 * var(--s));height:calc(495 * var(--p));
  background:url("{{ url_for('static', filename='img/acces/tete.webp') }}") 0 0/100% 100% no-repeat}
.pied{position:absolute;left:0;right:0;bottom:0;height:calc(171 * var(--p));
  background:url("{{ url_for('static', filename='img/acces/pied.webp') }}") 0 0/100% 100% no-repeat}
.img{height:calc(var(--h) * var(--p))}
.cache{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* textes */
.txt{white-space:nowrap;line-height:1.25}
.c{text-align:center}
.slogan{font-weight:700;font-size:calc(20.9 * var(--p));color:#010968}
h1.t{font-weight:700;color:#010C61}
.sous{font-weight:500;color:#1F267C}
/* bouton retour */
.retour{display:flex;align-items:center;justify-content:center;height:calc(61 * var(--p));border-radius:50%;background:#fff;
  box-shadow:0 calc(4 * var(--p)) calc(14 * var(--p)) rgba(20,50,140,.18);-webkit-tap-highlight-color:transparent}
.retour svg{width:calc(28 * var(--p));height:calc(28 * var(--p))}
/* champs */
.champ{display:flex;align-items:center;background:#F7F7FA;border:max(1px, calc(2 * var(--p))) solid #DCE1F6;
  box-shadow:0 calc(5 * var(--p)) calc(14 * var(--p)) rgba(40,70,160,.10);height:calc(var(--h) * var(--p))}
.champ:focus-within{border-color:#4D7CF5;box-shadow:0 0 0 calc(3 * var(--p)) rgba(42,95,240,.15)}
.champ .ico{position:absolute;left:calc(var(--ix) * var(--p));width:calc(var(--iw) * var(--p));height:calc(var(--ih) * var(--p));fill:#0136B7}
.champ input{position:absolute;left:calc(var(--tx) * var(--p));right:calc(var(--tr, 20) * var(--p));top:0;bottom:0;width:auto;
  border:0;outline:0;background:transparent;font:inherit;font-weight:500;color:#0B1A66;padding:0}
.champ input::placeholder{color:#5C61A2;opacity:1}
.oeil{position:absolute;right:calc(var(--er) * var(--p));top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;
  display:flex;padding:calc(6 * var(--p));-webkit-tap-highlight-color:transparent}
.oeil svg{width:calc(35 * var(--p));height:calc(22 * var(--p))}
@supports (-webkit-touch-callout:none){.champ input{font-size:max(16px, 1em)!important}}
/* liens */
.lien{color:#003AFB;text-decoration:underline;text-underline-offset:calc(4 * var(--p));text-decoration-thickness:max(1px, calc(1.6 * var(--p)))}
/* boutons */
.btn{display:flex;align-items:center;justify-content:center;border-radius:999px;text-decoration:none;font-family:inherit;font-weight:600;
  white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s,filter .15s;height:calc(var(--h) * var(--p))}
.btn:active{transform:scale(.98)}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible,.retour:focus-visible,.lien:focus-visible{outline:3px solid #22C55E;outline-offset:3px}
.btn.plein{border:0;color:#fff;background:linear-gradient(180deg,#0066FD 0%,#004EF1 33%,#0039C6 70%,#002AA2 100%);
  box-shadow:0 calc(10 * var(--p)) calc(20 * var(--p)) calc(-6 * var(--p)) rgba(4,52,190,.5),inset 0 calc(2 * var(--p)) 0 rgba(255,255,255,.2)}
.btn.vide{background:#fff;color:#0140F8;border:max(1.5px, calc(3 * var(--p))) solid #0A2FCB;box-shadow:0 calc(4 * var(--p)) calc(12 * var(--p)) rgba(40,90,220,.10)}
/* message d'erreur ou d'info */
.flash{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:10;width:min(92vw,440px);padding:12px 16px;border-radius:14px;
  font-size:14px;font-weight:600;line-height:1.35;background:#fff;color:#B42318;box-shadow:0 10px 30px rgba(10,30,90,.2);border-left:5px solid #E5484D}
.flash.ok{color:#0B6B3A;border-left-color:#22C55E}
/* ordinateur / tablette : l'en-tete reste a la largeur de la maquette et se fond sur les cotes */
@media (min-aspect-ratio:3/5){
  .tete{left:50%;width:calc(550 * var(--p));margin-left:calc(-275 * var(--p));
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,#000 75%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%),linear-gradient(180deg,#000 75%,transparent 100%);
    -webkit-mask-composite:source-in;mask-composite:intersect}
  .pied{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 35%);mask-image:linear-gradient(180deg,transparent 0,#000 35%)}
}
</style></head><body>
{% with messages = get_flashed_messages(with_categories=true) %}{% for cat, m in messages %}<div class="flash {{ cat }}" role="alert">{{ m }}</div>{% endfor %}{% endwith %}
<main class="ecran">
 <div class="tete" aria-hidden="true"></div>
 <div class="pied" aria-hidden="true"></div>
 {% block entete %}
 <a class="t retour" href="{{ url_for('accueil') }}" style="--x:27;--y:62;--w:61" aria-label="Retour à l'accueil"><svg viewBox="0 0 24 24" fill="none" stroke="#0044ED" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></a>
 <img class="t img" src="{{ url_for('static', filename='img/accueil/icone.webp') }}" style="--x:183.3;--y:67.4;--w:185.1;--h:167.3" alt="">
 <img class="t img" src="{{ url_for('static', filename='img/accueil/mot.webp') }}" style="--x:129.6;--y:233.8;--w:303.3;--h:65.8" alt="Scolaris">
 <p class="t txt c slogan" style="--x:6;--y:308.2">La scolarité, sans impayés</p>
 <svg class="t img" style="--x:192;--y:337;--w:181;--h:24" viewBox="0 0 181 24" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gs" x1="0" x2="1"><stop offset="0" stop-color="#2DD35E"/><stop offset=".6" stop-color="#11B83C"/><stop offset="1" stop-color="#27C653"/></linearGradient></defs><path d="M2 22C40 9 105 2 179 9 120 6 60 11 2 22Z" fill="url(#gs)"/></svg>
 {% endblock %}
 {% block contenu %}{% endblock %}
</main>
<script>
document.querySelectorAll('.oeil').forEach(function (b) {
  b.addEventListener('click', function () {
    var i = document.getElementById(b.dataset.pour), voir = i.type === 'password';
    i.type = voir ? 'text' : 'password';
    b.setAttribute('aria-label', voir ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
  });
});
setTimeout(function () { document.querySelectorAll('.flash.ok').forEach(function (f) { f.remove(); }); }, 6000);
</script>
</body></html>
