<div class="entete">
 <div class="barre">{% from '_marque.html' import mot %}<a class="marque" href="{{ url_for('tableau') }}"><img src="{{ url_for('static', filename='img/icone.png') }}" alt="">{{ mot(20, '#fff', '#4ADE80') }}</a>
 <span class="petit">{{ ecole.nom }}</span></div>
 <div class="menu-plus">
  <a href="{{ url_for('classes') }}">Classes et frais</a><a href="{{ url_for('paiements') }}">Paiements</a>
  {% if utilisateur.role == 'directeur' %}<a href="{{ url_for('equipe') }}">Équipe</a><a href="{{ url_for('parametres') }}">Paramètres</a>{% endif %}
  <form method="post" action="{{ url_for('deconnexion') }}" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Déconnexion</button></form>
 </div>
 {% if titre_entete %}<h1>{{ titre_entete }}</h1>{% endif %}
</div>
