{% extends '_acces.html' %}
{% block titre %}Connexion · Scolaris{% endblock %}
{% block contenu %}
 <h1 class="t txt c" style="--y:380.3;--f:43.8">Connexion</h1>
 <p class="t txt c sous" style="--y:431.9;--f:22.3">Connectez-vous à votre espace</p>
 <form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="t champ" style="--x:27;--y:506;--w:495;--h:70;--f:20.3;border-radius:calc(22 * var(--p))">
   <span class="cache">Adresse e-mail ou téléphone</span>
   <svg class="ico" style="--ix:22;--iw:33;--ih:26" viewBox="0 0 33 26" aria-hidden="true"><rect width="33" height="26" rx="3.5"/><path d="M2.5 3.5 16.5 14.5 30.5 3.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>
   <input name="identifiant" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Adresse e-mail ou téléphone" value="{{ request.form.identifiant }}" style="--tx:88">
  </label>
  <label class="t champ" style="--x:27;--y:600;--w:495;--h:70;--f:20.3;border-radius:calc(22 * var(--p))">
   <span class="cache">Mot de passe</span>
   <svg class="ico" style="--ix:23;--iw:29;--ih:32" viewBox="0 0 29 32" aria-hidden="true"><path d="M7 13V9.5a7.5 7.5 0 0 1 15 0V13" fill="none" stroke="#0136B7" stroke-width="3.6"/><rect y="12.5" width="29" height="19.5" rx="3.5"/><circle cx="14.5" cy="20.5" r="2.6" fill="#fff"/><rect x="13.3" y="21" width="2.4" height="5" rx="1.2" fill="#fff"/></svg>
   <input id="mdp" name="mot_de_passe" type="password" required autocomplete="current-password" placeholder="Mot de passe" style="--tx:88;--tr:75">
   <button type="button" class="oeil" data-pour="mdp" style="--er:11" aria-label="Afficher le mot de passe"><svg viewBox="0 0 35 22" aria-hidden="true"><path d="M17.5 2C9.6 2 4 7.5 2 11c2 3.5 7.6 9 15.5 9S31 14.5 33 11c-2-3.5-7.6-9-15.5-9Z" fill="none" stroke="#4A5284" stroke-width="3"/><circle cx="17.5" cy="11" r="5" fill="#4A5284"/></svg></button>
  </label>
  <p class="t txt" style="--x:223;--w:300;--y:689.7;--f:19;text-align:right"><a class="lien" href="{{ url_for('mot_de_passe_oublie') }}">Mot de passe oublié ?</a></p>
  <button class="t btn plein" style="--x:26;--y:749;--w:500;--h:73;--f:23.6;gap:calc(27 * var(--p))"><svg style="width:calc(33 * var(--p));height:calc(36 * var(--p))" viewBox="0 0 33 36" aria-hidden="true"><circle cx="16.5" cy="9" r="9" fill="#fff"/><path d="M0 33c0-8.6 7.4-14.2 16.5-14.2S33 24.4 33 33c0 1.7-1.3 3-3 3H3c-1.7 0-3-1.3-3-3Z" fill="#fff"/></svg>Se connecter</button>
 </form>
 <div class="t" style="--x:49;--w:195;--y:864.5;height:max(1px, calc(1.5 * var(--p)));background:#8E99CF" aria-hidden="true"></div>
 <p class="t txt c" style="--y:851.5;--f:21;font-weight:600;color:#000666">ou</p>
 <div class="t" style="--x:308;--w:195;--y:864.5;height:max(1px, calc(1.5 * var(--p)));background:#8E99CF" aria-hidden="true"></div>
 <a class="t btn vide" href="{{ url_for('inscription') }}" style="--x:26;--y:900;--w:500;--h:66;--f:23;gap:calc(27 * var(--p))"><svg style="width:calc(39 * var(--p));height:calc(39 * var(--p))" viewBox="0 0 39 39" aria-hidden="true"><defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F5BF5"/><stop offset="1" stop-color="#0230C2"/></linearGradient></defs><circle cx="19.5" cy="19.5" r="19.5" fill="url(#gp)"/><path d="M19.5 10.5v18M10.5 19.5h18" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>Créer un compte</a>
 <p class="t txt c" style="--y:988;--f:25;font-weight:700;color:#002DC6;display:flex;align-items:center;justify-content:center;gap:calc(12 * var(--p))"><span style="flex:none;display:grid;place-items:center;width:calc(36 * var(--p));height:calc(36 * var(--p));border-radius:50%;background:linear-gradient(180deg,#1F5BF5,#0230C2);box-shadow:0 calc(4 * var(--p)) calc(10 * var(--p)) rgba(2,48,194,.35)" aria-hidden="true"><svg style="width:calc(21 * var(--p));height:calc(21 * var(--p))" viewBox="0 0 24 24"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A63F6"/><stop offset="1" stop-color="#0024B0"/></linearGradient></defs><path fill="#fff" d="M12 1.2c-4.9 0-8.8 3.9-8.8 8.8v7c0 1.7 1.3 3 3 3H9v-8H5.4V10a6.6 6.6 0 0 1 13.2 0v2H15v8h3.6v.6H12a1.1 1.1 0 0 0 0 2.2h5.9c1.7 0 3-1.3 3-3V10c0-4.9-4-8.8-8.9-8.8Z"/></svg></span>Besoin d’aide ?</p>
 <p class="t txt c" style="--y:1033;--f:20.2;font-weight:500;color:#4D5092">Contactez votre établissement.</p>
{% endblock %}
