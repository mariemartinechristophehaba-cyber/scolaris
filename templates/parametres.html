{% extends 'base.html' %}
{% block titre %}Paramètres{% endblock %}
{% block entete %}{% set titre_entete = 'Paramètres de l’école' %}{% include '_entete.html' %}{% endblock %}
{% block contenu %}
<form method="post" class="carte" style="max-width:640px">
 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <label for="nom" style="margin-top:0">Nom de l'école</label><input id="nom" name="nom" required value="{{ ecole.nom }}">
 <label for="ville">Ville / quartier</label><input id="ville" name="ville" value="{{ ecole.ville or '' }}">
 <label for="telephone">Téléphone de l'école</label><input id="telephone" name="telephone" type="tel" value="{{ ecole.telephone or '' }}">
 <label for="om">Numéro Orange Money de l'école (affiché aux parents)</label><input id="om" name="om_numero" value="{{ ecole.om_numero or '' }}">
 <label for="annee">Année scolaire</label><input id="annee" name="annee" value="{{ ecole.annee or '' }}">
 <button class="btn bloc mt">Enregistrer</button>
</form>
{% endblock %}
